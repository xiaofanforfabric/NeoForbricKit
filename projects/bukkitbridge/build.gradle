plugins {
    id 'java-library'
}

// NeoFobric: the Bukkit/Paper plugin bridge, carried over from the Forbric project's kernel
// (src/runtime/java/org/cn/xiaofan/bukkit + src/runtime/java/io/papermc). The bridge's own
// sources are adopted UNCHANGED; only the kernel-side seams (boot entry, class transformer)
// are adapted to NeoForge's FML. See projects/bukkitbridge/README.md for the COPY/ADAPT split.
base {
    archivesName = 'bukkitbridge'
}

// NOTE on packaging: unlike fabricbridge (which runs on the bootstrap classpath next to FML and
// resolves everything at runtime), this subproject compiles the bridge's game-side code, which
// names net.minecraft.*. It compiles against a FIXED copy of Minecraft's classes — see the
// DownloaderJar task below — and NOT against project(':neoforge'). The reason is a build cycle:
// :neoforge consumes this project's jar at runtime (libraries(...) in projects/neoforge/build.gradle),
// so a compile dependency on :neoforge would close
//   :bukkitbridge:compileJava -> :neoforge:compileJava -> :bukkitbridge:jar -> :bukkitbridge:compileJava
// Compiling against the class files instead breaks it: the bridge needs the GAME's classes, and
// those are the same whichever project assembled them.
base {
    archivesName = 'bukkitbridge'
}

// NeoFobric: the Minecraft classes the bridge compiles against.
//
// These are the PATCHED classes (NeoForge's patches applied), not the clean ones MDG downloads:
// the bridge calls ArgumentTypeInfos.registerByClass, which NeoForge's patch adds — compiling
// against clean Minecraft fails with "cannot find symbol registerByClass". The patched classes are
// exactly what `:neoforge:compileJava` emits, so this jars up that task's output directory and the
// compileOnly below names the resulting file. UP-TO-DATE when the class files have not changed: a
// rerun costs an up-to-date check, not a repack.
//
// Why not `compileOnly(project(':neoforge'))`: that would close a build cycle — :neoforge consumes
// this project's jar at runtime (libraries(...) in projects/neoforge/build.gradle), so
//   :bukkitbridge:compileJava -> :neoforge:compileJava -> :bukkitbridge:jar -> :bukkitbridge:compileJava
// Taking the class files as a file input keeps the two projects' tasks ordered (the jar task depends
// on DownloaderJar, which depends on :neoforge:compileJava) without a configuration-level edge back.
final mcClassesDir = layout.buildDirectory.dir('neofobric-compile')
final mcClassesJar = mcClassesDir.map { it.file('minecraft-patched-classes.jar') }
final downloaderJar = tasks.register('DownloaderJar', Jar) {
    group = 'neofobric'
    description = 'Packages :neoforge\'s patched classes for :bukkitbridge to compile against (no cycle into :neoforge).'
    destinationDirectory = mcClassesDir
    archiveFileName = 'minecraft-patched-classes.jar'
    // :neoforge:compileJava emits both the patched net.minecraft.* and NeoForge's own net.neoforged.*.
    // Both are wanted: the bridge names only net.minecraft.*, but NeoForge's classes are harmless on a
    // compile-only classpath and pulling them apart would mean filtering 8k entries for no gain.
    from(project(':neoforge').tasks.named('compileJava').flatMap { it.destinationDirectory })
    // Reproducible: a jar whose entries carry mtimes would never be UP-TO-DATE and would repack on
    // every build.
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

dependencies {
    // Patched Minecraft's own classes, packaged by DownloaderJar above. compileOnly because the game
    // layer supplies them at runtime.
    compileOnly(files(mcClassesJar) {
        builtBy downloaderJar
    })
    // Minecraft's LIBRARIES — the classes its own code names but does not contain: DataFixerUpper
    // (com.mojang.serialization.*), netty (io.netty.*), brigadier, gson, guava, jspecify (the type
    // annotations on the joined jar's own signatures). minecraft-dependencies is a BOM: it fixes the
    // versions, and each of these is declared explicitly (a platform() alone would add no dependency).
    compileOnly(platform("net.neoforged:minecraft-dependencies:${project.minecraft_version}"))
    compileOnly "com.mojang:datafixerupper"
    compileOnly "com.mojang:brigadier"
    compileOnly "com.google.code.gson:gson"
    compileOnly "com.google.guava:guava"
    compileOnly "io.netty:netty-buffer"
    compileOnly "io.netty:netty-common"
    compileOnly "io.netty:netty-transport"
    compileOnly "org.jspecify:jspecify:1.0.0"
    compileOnly("net.neoforged.fancymodloader:loader:${fancy_mod_loader_version}") {
        transitive = false
    }
    compileOnly("net.neoforged:mergetool:${mergetool_version}:api") { transitive = false }
    compileOnly("org.slf4j:slf4j-api:2.0.17")
    // The bridge reads and rewrites plugin jars and the game's classes with ASM, and reuses the
    // same mixin version the rest of the build pins.
    for (var asmModule : ["org.ow2.asm:asm", "org.ow2.asm:asm-tree", "org.ow2.asm:asm-commons"]) {
        compileOnly(asmModule) {
            version {
                strictly project.asm_version
            }
        }
    }

    // Paper's API is the half that is NOT shipped: the bridge declares these compileOnly and
    // resolves them at runtime through the fetcher (see PaperApiFetcher). The version is pinned
    // to the one Forbric's bridge was written against and the one Paper publishes for MC 26.2.
    compileOnly('io.papermc.paper:paper-api:26.2.build.133-stable')

    testImplementation(platform("org.junit:junit-bom:${project.jupiter_api_version}"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
    testRuntimeOnly("org.slf4j:slf4j-api:2.0.17")
    for (var asmModule : ["org.ow2.asm:asm", "org.ow2.asm:asm-tree", "org.ow2.asm:asm-commons"]) {
        testImplementation(asmModule) {
            version {
                strictly project.asm_version
            }
        }
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.withType(Javadoc.class).configureEach {
    enabled = false
}

// NeoFobric: a consumable configuration carrying this project's jar as a plain FILE artifact, with
// no producer task and therefore no task-graph edge. projects/neoforge consumes it in libraries(...)
// — which extends `api`, so the normal project dependency would make :neoforge:compileJava depend on
// :bukkitbridge:classes, and :bukkitbridge:compileJava already depends on :neoforge:compileJava (via
// DownloaderJar) — a cycle.
//
// The jar task's ordering is arranged from the OTHER side: tasks that resolve this configuration
// (the launcher-profile and installer tasks) already run after the full build, and the installer
// embedding below names the jar task directly.
configurations {
    deployJar {
        canBeConsumed = true
        canBeResolved = false
    }
}

configurations.deployJar.outgoing.artifact(layout.buildDirectory.file("libs/${base.archivesName.get()}-${project.version}.jar")) {
    // Plain file: no task, hence no edge.
}
